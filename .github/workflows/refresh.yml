name: Refresh the daily shelf
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install --quiet yt-dlp
      - run: npm ci --omit=dev
      - run: node scripts/refresh.mjs
      - name: Commit if changed
        run: |
          git config user.name "references-bot"
          git config user.email "references-bot@users.noreply.github.com"
          git add shelf/daily.json
          git diff --cached --quiet || (git commit -m "shelf: $(date -u +%F)" && git push)
